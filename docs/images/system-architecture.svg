<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Servlet2Spring 시스템 아키텍처</title>
  <desc id="desc">사용자 요청이 AWS EC2의 Spring Boot 애플리케이션으로 전달되고, 애플리케이션이 RDS MySQL, S3, Kakao OAuth2와 연동되는 구조와 Maven JAR 배포 흐름</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: Inter, Pretendard, "Noto Sans KR", Arial, sans-serif; }
      .label { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 15px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 13px; font-weight: 600; fill: #64748b; }
      .service { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1400" height="112" fill="url(#header)"/>
  <text x="60" y="55" class="font" font-size="30" font-weight="800" fill="#ffffff">Servlet2Spring</text>
  <text x="60" y="85" class="font" font-size="17" font-weight="500" fill="#bfdbfe">Spring Boot · AWS 배포 시스템 아키텍처</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="60" y="205" width="230" height="135" rx="20" class="service"/>
  </g>
  <circle cx="175" cy="247" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <path d="M132 304c7-28 26-42 43-42s36 14 43 42" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="175" y="322" text-anchor="middle" class="font label">사용자</text>
  <text x="175" y="365" text-anchor="middle" class="font small">Browser / API Client</text>

  <!-- AWS boundary -->
  <rect x="355" y="150" width="985" height="570" rx="30" fill="#ffffff" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="390" y="130" width="185" height="44" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="482" y="159" text-anchor="middle" class="font label" fill="#c2410c">AWS Cloud</text>

  <!-- EC2 -->
  <g filter="url(#shadow)">
    <rect x="520" y="205" width="505" height="410" rx="26" fill="url(#app)" stroke="#f97316" stroke-width="3"/>
  </g>
  <rect x="550" y="230" width="120" height="42" rx="12" fill="#f97316"/>
  <text x="610" y="258" text-anchor="middle" class="font" font-size="19" font-weight="800" fill="#ffffff">Amazon EC2</text>
  <text x="690" y="258" class="font small">Executable JAR · Embedded Tomcat :8080</text>

  <!-- app layers -->
  <rect x="565" y="300" width="415" height="65" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <circle cx="602" cy="332" r="18" fill="#22c55e"/>
  <path d="M592 334c13-2 20-11 20-18-11 2-21 8-20 18zm0 0c5 0 11 1 16 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="635" y="328" class="font label">Spring Security</text>
  <text x="635" y="350" class="font tiny">Form Login · OAuth2 · JWT · 권한 검사</text>

  <rect x="565" y="382" width="415" height="65" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="585" y="411" class="font label">Spring MVC / REST Controller</text>
  <text x="585" y="433" class="font tiny">Thymeleaf · Validation · OpenAPI</text>

  <rect x="565" y="464" width="415" height="56" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="585" y="499" class="font label">Service · Transaction</text>

  <rect x="565" y="537" width="415" height="56" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <text x="585" y="572" class="font label">JPA · Querydsl · MyBatis · JDBC</text>

  <!-- RDS -->
  <g filter="url(#shadow)">
    <rect x="1090" y="235" width="205" height="160" rx="20" class="service"/>
  </g>
  <ellipse cx="1192" cy="278" rx="42" ry="17" fill="#3b82f6"/>
  <path d="M1150 278v55c0 9 19 17 42 17s42-8 42-17v-55" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <path d="M1150 305c0 9 19 17 42 17s42-8 42-17" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="1192" y="370" text-anchor="middle" class="font label">Amazon RDS</text>
  <text x="1192" y="390" text-anchor="middle" class="font small">MySQL</text>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="1090" y="465" width="205" height="160" rx="20" class="service"/>
  </g>
  <path d="M1160 500l32-17 32 17v55l-32 17-32-17z" fill="#ef4444"/>
  <path d="M1160 500l32 18 32-18M1192 518v54" fill="none" stroke="#fee2e2" stroke-width="3"/>
  <text x="1192" y="595" text-anchor="middle" class="font label">Amazon S3</text>
  <text x="1192" y="615" text-anchor="middle" class="font small">Image Storage</text>

  <!-- Kakao -->
  <g filter="url(#shadow)">
    <rect x="60" y="430" width="230" height="125" rx="20" class="service"/>
  </g>
  <ellipse cx="175" cy="468" rx="39" ry="28" fill="#fee500"/>
  <path d="M158 490l-7 17 20-12" fill="#fee500"/>
  <text x="175" y="474" text-anchor="middle" class="font" font-size="15" font-weight="800" fill="#3c1e1e">TALK</text>
  <text x="175" y="530" text-anchor="middle" class="font label">Kakao OAuth2</text>

  <!-- Runtime connections -->
  <path d="M290 270H475c22 0 25 18 25 40v22h55" class="blue-line"/>
  <text x="395" y="251" text-anchor="middle" class="font small">HTTP Request</text>
  <path d="M290 490H500v-158h55" class="line dash"/>
  <text x="390" y="476" text-anchor="middle" class="font small">OAuth2 Login</text>
  <path d="M980 565h45c30 0 35-250 65-250" class="line"/>
  <text x="1048" y="339" text-anchor="middle" class="font tiny">SQL</text>
  <path d="M980 414h45c30 0 35 131 65 131" class="line"/>
  <text x="1048" y="526" text-anchor="middle" class="font tiny">AWS SDK</text>
  <path d="M1090 590c-170 80-595 97-800-250" class="blue-line dash"/>
  <text x="645" y="691" text-anchor="middle" class="font small">Presigned URL로 이미지 조회</text>

  <!-- Build and deployment -->
  <g filter="url(#shadow)">
    <rect x="155" y="770" width="260" height="82" rx="18" class="service"/>
  </g>
  <text x="285" y="804" text-anchor="middle" class="font label">Local Development</text>
  <text x="285" y="830" text-anchor="middle" class="font small">Git · IntelliJ IDEA</text>

  <rect x="535" y="770" width="260" height="82" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="665" y="804" text-anchor="middle" class="font label">Maven Build</text>
  <text x="665" y="830" text-anchor="middle" class="font small">./mvnw package → JAR</text>

  <path d="M415 811h105" class="line"/>
  <text x="468" y="796" text-anchor="middle" class="font tiny">Build</text>
  <path d="M795 811h75c95 0 120-95 14-196" class="line dash"/>
  <text x="920" y="788" class="font tiny">JAR Deploy</text>

  <text x="1340" y="878" text-anchor="end" class="font tiny">Servlet2Spring Architecture</text>
</svg>
